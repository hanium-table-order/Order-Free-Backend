name: Deploy to EC2

on:
  push:
    branches: [ "dev" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build -x test --no-build-cache

      - name: Check generated JAR file
        run: ls -la build/libs

      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "build/libs/Order-Free-Backend-0.0.1-SNAPSHOT.jar"
          target: "/home/ubuntu/"
          overwrite: true

      - name: Restart service on EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            sudo mv /home/ubuntu/Order-Free-Backend-0.0.1-SNAPSHOT.jar /home/ubuntu/table-order-0.0.1-SNAPSHOT.jar
            sudo systemctl daemon-reload
            sudo systemctl restart tableorder
            sleep 3
            sudo systemctl status tableorder --no-pager -n 30
