// ============== 🛠️ 최종 수정된 부분 시작 ==============
// Gradle 빌드 스크립트 자체의 클래스패스에 라이브러리를 추가합니다.
// 이 방식은 플러그인 설정보다 우선하며 가장 확실하게 동작합니다.
buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath "org.flywaydb:flyway-mysql:10.10.0"
        classpath "com.mysql:mysql-connector-j:8.4.0"
    }
}
// ============== 🛠️ 최종 수정된 부분 끝 ==============

plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.4'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.flywaydb.flyway' version '10.10.0'
}

// 이전에 추가했던 flyway { ... } 블록은 이제 필요 없으므로 삭제했습니다.

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // 웹 서버(Tomcat) 포함
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // JPA
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // 요청 검증
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // 보안 (JWT 인가)
    implementation 'org.springframework.boot:spring-boot-starter-security'
    // 로깅 (Logback)
    implementation 'org.springframework.boot:spring-boot-starter-logging'
    // Redis (캐시/락)
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // JWT (HS256)
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // QR 생성
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.google.zxing:javase:3.5.3'

    // .env 로더
    implementation 'me.paulschwarz:spring-dotenv:4.0.0'

    // DB 드라이버
    runtimeOnly 'com.mysql:mysql-connector-j'

    // Flyway - 데이터베이스 마이그레이션
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'

    // Swagger/OpenAPI
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // PostConstruct 등 Java EE 어노테이션 지원 (Java 17 호환)
    implementation 'javax.annotation:javax.annotation-api:1.3.2'

    // WebSocket (브로드캐스트 지원)
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
}